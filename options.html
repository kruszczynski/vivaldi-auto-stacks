<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Stacks settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input[type=text], input[type=password], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .row label { margin: 0; }
    small { color: #666; }
    button { margin-top: 20px; padding: 6px 16px; }
    #status { margin-left: 8px; color: #2e7d32; }
  </style>
</head>
<body>
  <h2>Auto Stacks</h2>

  <div class="row">
    <input type="checkbox" id="autoDomain">
    <label for="autoDomain">Automatically stack GitHub pull requests and projects</label>
  </div>

  <label for="minTabsForDomain">Minimum tabs before a stack is created</label>
  <input type="number" id="minTabsForDomain" min="2" max="20">

  <label for="apiKey">Anthropic API key (for AI regroup)</label>
  <input type="password" id="apiKey" placeholder="sk-ant-...">
  <small>Stored locally in this browser. Tab titles and URLs are sent to the Anthropic API only when you trigger an AI regroup.</small>

  <label for="model">Model</label>
  <input type="text" id="model">
  <small>A fast, cheap model is plenty for this.</small>

  <label for="aiInstructions">Extra grouping instructions (optional)</label>
  <textarea id="aiInstructions" rows="4" placeholder="e.g. Keep anything distil labs related in one stack. Put email and calendar together."></textarea>

  <button id="save">Save</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
